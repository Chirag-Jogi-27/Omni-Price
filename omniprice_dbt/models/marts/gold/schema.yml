version: 2

models:
  - name: price_daily_enriched
    description: >
      Core daily price mart at the grain of (asin, snapshot_date).
      Enriches price observations with master product specifications (brand, 
      normalized quantity, pack unit) and standardizes unit pricing (e.g. price per 100g / 100ml / 1 count).
    columns:
      - name: asin_snapshot_date
        description: Surrogate primary key composed of asin and snapshot_date.
        tests:
          - unique
          - not_null

      - name: asin
        description: Amazon Standard Identification Number.
        tests:
          - not_null

      - name: snapshot_date
        description: Calendar business date of the price observation.
        tests:
          - not_null

      - name: price
        description: Current selling price in INR. Null when the product is unavailable or price extraction failed — check is_price_missing before aggregating.

      - name: is_price_missing
        description: True when no price was captured for this observation (product unavailable or price extraction failed). Filter on this flag for price analytics; keep the rows for availability analytics.

      - name: price_missing_reason
        description: Spider v2 diagnostic — currently_unavailable | no_price_section | selector_miss. Null when a price was captured, and for pre-v2 crawls (before the spider v2 deploy).

      - name: availability_status
        description: Spider v2 availability enum — in_stock | currently_unavailable | other | unknown. Null for pre-v2 crawls (before the spider v2 deploy).

      - name: is_price_gt_mrp
        description: Data quality anomaly flag indicating if selling price exceeds MRP.
        tests:
          - not_null
      - name: product_title
        description: Product title from history, falling back to the latest search-observation title.

      - name: brand
        description: Brand from product history, falling back to the price-observation brand (never null after fallback).
        tests:
          - not_null    
          

  - name: category_daily
    description: >
      Daily market index aggregated by FMCG micro-category and search category.
      Tracks catalog depth, average selling price, average category discount,
      average rating, and sponsored brand search share over time.
    columns:
      - name: micro_category__search_category__snapshot_date
        description: Surrogate primary key for category daily snapshot.
        tests:
          - unique
          - not_null

      - name: snapshot_date
        description: Calendar business date of the category aggregate.
        tests:
          - not_null

      - name: product_count
        description: Number of active products observed in this category on this date.
        tests:
          - not_null

      - name: sponsored_share
        description: Share of search rows that were sponsored (0 to 1).
        tests:
          - not_null

  - name: shrinkflation_alert
    description: >
      Audit log and alert mart for stealth price increases (shrinkflation).
      Fires when an ASIN's physical quantity/weight is reduced (shrink_pct > 0)
      across consecutive versions in the SCD Type 2 history table.
    columns:
      - name: spec_change_event_key
        description: Surrogate primary key composed of asin and change_date.
        tests:
          - unique
          - not_null

      - name: asin
        description: Amazon Standard Identification Number for the shrunk product.
        tests:
          - not_null

      - name: shrink_pct
        description: Percentage reduction in pack quantity/weight.
        tests:
          - not_null

      - name: change_date
        description: Date when the specification reduction was first detected.
        tests:
          - not_null

      - name: is_confirmed_shrinkflation
        description: >
          True only when the unit price held or rose after the quantity drop
          (price-anchored confirmation). False when the unit price fell, or
          when a pre/post 7-day price window could not be established.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: old_unit_price
        description: Pre-change 7-day average unit price. Null when no pre-change price exists.

      - name: new_unit_price
        description: Post-change 7-day average unit price. Null when no post-change price exists.

      - name: unit_price_surge_pct
        description: Percentage change in unit price across the shrink event.